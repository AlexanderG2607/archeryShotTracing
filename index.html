  <div class="mut">La app te guía con cuenta regresiva y saca 10 fotos de cada gesto. Podés usar el gesto que quieras; los que no calibres usan el sugerido.</div>
  <button class="btn pri" style="margin:10px 0" data-a="gestCal" data-v="all">✋ Calibrar los 4 gestos</button>
  ${Object.keys(RLBL).map(r=>{const n=((c.gestures||{})[r]||[]).length;return `<div class="list-item"><span style="font-size:22px">${RSUG[r]}</span><div class="sp"><b>${RLBL[r]}</b><div class="mut">${n?n+' fotos guardadas':'Usa el gesto sugerido'}</div>${n?`<div class="gph" data-g="${r}" data-n="${n}"></div>`:''}</div><button class="btn sm" data-a="gestCal" data-v="${r}">Grabar</button>${n?`<button class="btn sm" data-a="gestClear" data-v="${r}">✕</button>`:''}</div>`}).join('')}
  </div>`;
};

/* ---- Etiquetado de grabaciones ---- */
let L=null;
VIEWS.label=id=>{
  const r=DB.recs.find(x=>x.id===id);if(!r)return VIEWS.calib();
  setTimeout(()=>initLabel(r),0);
  return `${back('calib')}<h1>Etiquetar tiros</h1>
  <div class="mut">Mové la barra hasta el cuadro exacto en que empieza cada fase y tocá «Marcar». Al final marcá el fin del tiro y guardalo. Repetí con cada tiro de la grabación.</div>
  <div class="lab" style="aspect-ratio:${r.w||4}/${r.h||3}"><video id="lv" playsinline muted preload="auto"></video><canvas id="lc"></canvas></div>
  <input type="range" id="lr" min="0" max="${Math.round(r.dur)}" step="1" value="0" data-c="lseek" style="padding:0;margin:10px 0">
  <div class="row" style="justify-content:space-between"><button class="btn sm" data-a="lstep" data-v="-500">−½ s</button><button class="btn sm" data-a="lstep" data-v="-1">◀ cuadro</button><button class="btn sm pri" data-a="lplay" id="lpb">▶</button><button class="btn sm" data-a="lstep" data-v="1">cuadro ▶</button><button class="btn sm" data-a="lstep" data-v="500">+½ s</button></div>
  <div class="row" style="margin-top:6px"><b id="lt">0,00 s</b><span class="mut" id="lmet"></span></div>
  <div class="card" id="lshot"></div><div id="lsaved"></div>`;
};
async function initLabel(r){
  const d=await idbGet('rec',r.id);if(!d){toast('No se encontró la grabación en este celu');return;}
  if(L&&L.url)URL.revokeObjectURL(L.url);
  L={r,F:d.frames,n:d.n,times:new Float32Array(d.n),t:0,shot:newLabShot(),playing:false,url:null};
  for(let k=0;k<d.n;k++)L.times[k]=d.frames[k*FR];
  const v=$('#lv'),c=$('#lc');if(!c)return;c.width=r.w||640;c.height=r.h||480;
  if(r.mirror){v.classList.add('mirror');c.classList.add('mirror');}
  if(d.video){L.url=URL.createObjectURL(d.video);v.src=L.url;v.onloadeddata=()=>labSeek(L.t);v.onerror=()=>{v.remove();labDraw();};}else v.remove();
  renderLabShot();labSeek(0);
}
function newLabShot(){return{id:null,marks:new Array(P().phases.length).fill(null),end:null};}
function nearestFrame(t){const a=L.times;let lo=0,hi=L.n-1;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<t)lo=m+1;else hi=m;}if(lo>0&&Math.abs(a[lo-1]-t)<Math.abs(a[lo]-t))lo--;return lo;}
function labSeek(t,fromVideo){
  if(!L)return;L.t=Math.max(0,Math.min(t,L.r.dur));
  const r=$('#lr');if(r)r.value=L.t;const lt=$('#lt');if(lt)lt.textContent=fx(L.t/1000,2)+' s';
  const v=$('#lv');if(v&&!fromVideo&&v.readyState>=1){try{v.currentTime=L.t/1000;}catch(e){}}
  labDraw();
}
function labDraw(){
  const c=$('#lc');if(!c||!L)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  if(!$('#lv')){x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);}
  const fr=frameAt(L.F,nearestFrame(L.t));drawSk(x,fr.lm,c.width,c.height,P());
  const p=P(),bS=SIDE[p.bowHand],sS=SIDE[p.bowHand==='L'?'R':'L'],W=c.width,H=c.height;
  const q=fr.lm.map(o=>({x:o.x*W,y:o.y*H,v:o.visibility}));const{s}=torsoScale(q);const si=q[sS.ix],sw=q[sS.wr];
  const mo=dist(si,q[9])<dist(si,q[10])?q[9]:q[10];
  const k=nearestFrame(L.t);let sp=0;if(k>0){const a=frameAt(L.F,k-1).lm[sS.wr],dt=(L.times[k]-L.times[k-1])/1000;if(dt>0)sp=dist({x:a.x*W,y:a.y*H},sw)/s/dt;}
  const m=$('#lmet');if(m)m.textContent=` · mano–comisura ${fx(Math.min(dist(si,mo),dist(sw,mo))/s,2)} · vel. mano cuerda ${fx(sp,1)}`;
}
function drawSk(x,lm,W,H,p){
  const bS=SIDE[p.bowHand],sS=SIDE[p.bowHand==='L'?'R':'L'];const bowSet=new Set([bS.sh,bS.el,bS.wr,bS.ix]),strSet=new Set([sS.sh,sS.el,sS.wr,sS.ix]);const lw=Math.max(2,W/320);x.lineCap='round';
  for(const[a,b]of CONN){if(lm[a].visibility<0.3||lm[b].visibility<0.3)continue;x.strokeStyle=bowSet.has(a)&&bowSet.has(b)?'#3ddc84':strSet.has(a)&&strSet.has(b)?'#ff9f43':'rgba(255,255,255,.6)';x.lineWidth=lw*1.6;x.beginPath();x.moveTo(lm[a].x*W,lm[a].y*H);x.lineTo(lm[b].x*W,lm[b].y*H);x.stroke();}
  const dp=(i,c,r)=>{x.fillStyle=c;x.beginPath();x.arc(lm[i].x*W,lm[i].y*H,r,0,7);x.fill();};
  dp(bS.wr,'#3ddc84',lw*4);dp(sS.wr,'#ff9f43',lw*4);dp(9,'#ff6bd6',lw*2.5);dp(10,'#ff6bd6',lw*2.5);
}
function renderLabShot(){
  if(!L)return;const ph=P().phases,s=L.shot;const el=$('#lshot');if(!el)return;
  const row=(lbl,val,key)=>`<div class="row" style="margin:6px 0"><span class="sp">${lbl}</span><span class="mut">${val!=null?fx(val/1000,2)+' s':'—'}</span>${val!=null?`<button class="btn sm" data-a="lgo" data-v="${val}">Ir</button>`:''}<button class="btn sm pri" data-a="lmark" data-v="${key}">Marcar</button></div>`;
  el.innerHTML=`<b>${s.id?'Editando tiro':'Tiro nuevo'}</b>${ph.map((p,i)=>row(`${i+1}. Inicio de ${h(p.name)}`,s.marks[i],i)).join('')}${row('🏁 Fin del tiro',s.end,'end')}
  <div class="row" style="margin-top:8px"><button class="btn sm" data-a="lclear">Limpiar</button><div class="sp"></div><button class="btn pri" data-a="lsave">💾 Guardar tiro</button></div>`;
  const sv=$('#lsaved');if(sv)sv.innerHTML=L.r.shots.length?`<h3>Tiros etiquetados en esta grabación (${L.r.shots.length})</h3><div class="card" style="padding:0">${L.r.shots.map((x,i)=>`<div class="list-item"><div class="sp"><b>Tiro ${i+1}</b><div class="mut">desde ${fx(x.marks[0]/1000,1)} s · dura ${fx((x.end-x.marks[0])/1000,1)} s</div></div><button class="btn sm" data-a="ledit" data-v="${x.id}">Editar</button><button class="btn sm danger" data-a="ldel" data-v="${x.id}">🗑</button></div>`).join('')}</div>
  <div class="mut" style="margin-top:6px">Total en el perfil: ${labeledCount(P())}/10 tiros.</div>`:'';
}
A.lstep=v=>{if(!L)return;v=+v;if(Math.abs(v)===1){const k=Math.max(0,Math.min(L.n-1,nearestFrame(L.t)+v));labSeek(L.times[k]);}else labSeek(L.t+v);};
A.lgo=v=>labSeek(+v);
A.lplay=()=>{if(!L)return;const v=$('#lv'),b=$('#lpb');
  if(L.playing){L.playing=false;if(v)v.pause();b.textContent='▶';return;}
  L.playing=true;b.textContent='⏸';let last=performance.now();
  if(v){v.currentTime=L.t/1000;v.play().catch(()=>{});}
  const tick=()=>{if(!L||!L.playing||!$('#lc'))return;const now=performance.now();
    if(v&&!v.paused)labSeek(v.currentTime*1000,true);else if(!v)labSeek(L.t+(now-last));last=now;
    if(L.t>=L.r.dur||(v&&v.ended)){L.playing=false;$('#lpb').textContent='▶';return;}requestAnimationFrame(tick);};
  requestAnimationFrame(tick);};
A.lmark=k=>{if(!L)return;if(k==='end')L.shot.end=L.t;else L.shot.marks[+k]=L.t;renderLabShot();};
A.lclear=()=>{L.shot=newLabShot();renderLabShot();};
A.ledit=id=>{const s=L.r.shots.find(x=>x.id===id);if(!s)return;L.shot={id:s.id,marks:[...s.marks],end:s.end};while(L.shot.marks.length<P().phases.length)L.shot.marks.push(null);L.shot.marks.length=P().phases.length;renderLabShot();labSeek(s.marks[0]);};
A.ldel=id=>{L.r.shots=L.r.shots.filter(x=>x.id!==id);save();renderLabShot();};
A.lsave=()=>{
  const s=L.shot;if(s.marks.some(x=>x==null)||s.end==null)return toast('Marcá el inicio de todas las fases y el fin del tiro');
  const all=[...s.marks,s.end];for(let i=1;i<all.length;i++)if(all[i]<=all[i-1])return toast('Las marcas tienen que ir en orden de tiempo');
  const pk=t=>frameAt(L.F,nearestFrame(t)).lm.map(o=>[+o.x.toFixed(4),+o.y.toFixed(4),+o.visibility.toFixed(2)]);
  const pts=s.marks.map((t,i)=>({fase:P().phases[i].name,entrada:pk(t),salida:pk(i<s.marks.length-1?s.marks[i+1]:s.end)}));
  const shot={id:s.id||uid(),marks:[...s.marks],end:s.end,sig:phSig(P()),pts};
  L.r.shots=L.r.shots.filter(x=>x.id!==shot.id);L.r.shots.push(shot);L.r.shots.sort((a,b)=>a.marks[0]-b.marks[0]);
  save();L.shot=newLabShot();renderLabShot();const n=labeledCount(P());toast(`✔ Tiro guardado · ${n}/10${n>=10?' — ¡ya podés entrenar!':''}`);
};

/* ========= INICIO ========= */
idbOpen();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
try{history.replaceState({v:'home'},'');}catch(e){}
render();
</script>
